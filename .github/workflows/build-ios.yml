name: Build iOS App (Option B Zero Local Setup)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Add Capacitor iOS Platform
        run: |
          npm install @capacitor/ios@^6.0.0
          npx cap add ios
          npx cap sync ios

      - name: Build iOS Xcode Workspace
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -destination generic/platform=iOS -allowProvisioningUpdates CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO clean build

      - name: Upload iOS Build Output
        uses: actions/upload-artifact@v4
        with:
          name: sweatcircle-ios-build
          path: ios/App/build
